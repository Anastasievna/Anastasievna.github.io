<main class="cart-page-wrapper">
  <div class="cart-container">
    <h1 class="cart-title">Shopping Cart</h1>

    <div class="cart-items-list" id="cart-items-list">
      @if (cartService.cart | async; as cartProducts) {
        @for (product of cartProducts; track product.id) {
          <app-cart-product
            [cartProduct]="product"
            (increase)="increaseProduct(product.id)"
            (decrease)="decreaseProduct(product.id)"
            (remove)="removeProduct(product)"
          />
        }
      }
    </div>

    <div class="cart-summary">
      <div class="cart-summary__total">
        <p>Total</p>
        <p id="cart-total-price">
          @if (cartTotal$ | async; as cartTotal) {
            {{ typeof cartTotal == 'number' ? `$${cartTotal.toFixed(2)}` : '' }}
          }
        </p>
      </div>
      <a routerLink="/checkout" class="button button--primary button--checkout"
        >Proceed to Checkout</a
      >
    </div>
  </div>
</main>
